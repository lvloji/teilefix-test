<!DOCTYPE html>
  <html lang="de">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testseite - teilefix.de</title>
  <style>
  body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
display: flex;
align-items: center;
justify-content: center;
height: 100vh;
margin: 0;
background: linear-gradient(135deg, #1e3c72, #2a5298);
color: white;
text-align: center;
}
.box {
  padding: 40px 60px;
background: rgba(255,255,255,0.08);
border-radius: 16px;
backdrop-filter: blur(6px);
}
h1 { font-size: 2rem; margin-bottom: 10px; }
p { opacity: 0.85; }
</style>
  </head>
  <body>
  <div class="box">
  <h1>Es funktioniert!</h1>
  <p>Diese Testseite laeuft erfolgreich ueber die Domain.</p>
  <p id="time"></p>
  </div>
  <script>
  document.getElementById('time').textContent = 'Geladen am: ' + new Date().toLocaleString('de-DE');
</script>
  </body>
  </html>
